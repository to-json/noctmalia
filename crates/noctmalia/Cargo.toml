[package]
name = "noctmalia"
description = "A Noctalia-native front end for Thunderbird, running headless as a daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Wayland chrome with the shadow outside the window geometry; needs noctalia-iced's patched crates.
wayland-chrome = ["noctalia-iced/wayland-chrome"]

[lib]
name = "noctmalia"
path = "src/lib.rs"

[[bin]]
name = "noctmalia"
path = "src/main.rs"

[dependencies]
noctmalia-bridge.workspace = true
litehtml-sys = { path = "../litehtml-sys" }
chrono.workspace = true
chrono-tz.workspace = true
noctalia-iced.workspace = true
iced.workspace = true
# For real text-width measurement in `surfaces::html_view` — see litehtml-sys's `render` callback.
# Not re-exported by the top-level `iced` crate, so this is a direct dependency; pinned to the exact
# version `iced` 0.14 itself resolves to, since it must share the same global font system.
iced_graphics = "=0.14.0"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
# `prctl(PR_SET_PDEATHSIG)` and `kill(2)` for the Thunderbird this process spawns; see `thunderbird`.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Lays the real widget tree out headlessly, so a claim about what is on screen can be checked
# against what is on screen.
iced_test = "0.14"
iced_selector = "0.14"
