name: noctmalia

services:
  tbd:
    build: ./tbd
    image: noctmalia/tbd:155.0.1
    platform: linux/amd64
    init: true
    shm_size: 1gb
    environment:
      TBD_MODE: headless
      TBD_EXTRA_PREFS: ${TBD_EXTRA_PREFS:-}
    volumes:
      - tbd-profile:/data/profile
      - bridge-run:/run/noctmalia
    depends_on:
      mailnd:
        condition: service_healthy

  # Stand-in until the Rust mailnd exists.
  mailnd:
    image: python:3.13-slim
    command: ["python", "-u", "/tools/mailnd-stub.py"]
    volumes:
      - ./tools:/tools:ro
      - bridge-run:/run/noctmalia
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/run/noctmalia/ctl.sock')"]
      interval: 2s
      retries: 30

  # Local IMAP/SMTP for development and tools/smoke.sh. Accepts any recipient.
  greenmail:
    image: greenmail/standalone:2.1.13
    profiles: ["dev"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=j:secret@noctmalia.test

volumes:
  tbd-profile:
  bridge-run:
